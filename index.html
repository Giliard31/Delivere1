<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App</title>
    
    <!-- Configurações para virar Aplicativo (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4757">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #ff4757;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:active {
            background-color: #e84118;
        }
    </style>
</head>
<body>

    <header>Seu Delivery</header>

    <div class="container">
        <h2>Bem-vindo ao nosso Delivery!</h2>
        <p style="margin-top: 10px; color: #666;">Faça seu pedido rápido e prático direto pelo celular.</p>
        
        <button class="btn" onclick="iniciarApp()">Entrar / Cadastrar</button>
    </div>

    <script>
        function iniciarApp() {
            alert("Tela de login/cadastro será aberta aqui!");
        }

        // Registra o aplicativo para funcionar offline e ser instalado
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("App pronto para instalação!"));
        }
    </script>

</body>
</html>
